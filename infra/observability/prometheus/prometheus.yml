global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local
    lab: pixflow

scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-api:8080"]
  - job_name: outbox-relay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["outbox-relay:8080"]
  - job_name: payment-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-worker:8080"]
  - job_name: psp-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["psp-simulator:8080"]
  - job_name: reconciliation-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reconciliation-worker:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
