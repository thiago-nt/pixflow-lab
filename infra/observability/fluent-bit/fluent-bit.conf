[SERVICE]
    Flush                     2
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    Parsers_File              /fluent-bit/etc/pixflow-parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /buffers
    storage.sync              normal
    storage.checksum          On
    storage.backlog.mem_limit 16M

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /buffers/docker-logs.db
    DB.Sync           Normal
    Read_from_Head    Off
    Refresh_Interval  5
    Rotate_Wait       10
    Mem_Buf_Limit     24M
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        pixflow_json
    Reserve_Data  Off
    Preserve_Key  Off

[FILTER]
    Name   grep
    Match  docker.*
    Regex  service ^(payment-api|outbox-relay|payment-worker|psp-simulator|reconciliation-worker)$

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    HTTP_User           pixflow_ingest
    HTTP_Passwd         ${ELASTIC_PASSWORD}
    Logstash_Format     On
    Logstash_Prefix     pixflow-logs
    Generate_ID         On
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
    Workers             1
