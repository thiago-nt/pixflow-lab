spring:
  application:
    name: reconciliation-worker
  datasource:
    url: ${PIXFLOW_DB_URL:jdbc:postgresql://127.0.0.1:55432/pixflow}
    username: ${PIXFLOW_DB_USER:pixflow_app}
    password: ${PIXFLOW_DB_PASSWORD:pixflow_lab_dev_only}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway.enabled: false

pixflow:
  psp:
    base-url: ${PIXFLOW_PSP_URL:http://127.0.0.1:18081}
  reconciliation:
    scheduling-enabled: ${PIXFLOW_RECONCILIATION_SCHEDULING_ENABLED:true}
    owner-prefix: ${PIXFLOW_RECONCILIATION_OWNER_PREFIX:reconciliation-worker}
    lease-ttl: ${PIXFLOW_RECONCILIATION_LEASE_TTL:30s}
    poll-delay: ${PIXFLOW_RECONCILIATION_POLL_DELAY:2s}
    batch-size: ${PIXFLOW_RECONCILIATION_BATCH_SIZE:10}
    max-attempts: ${PIXFLOW_RECONCILIATION_MAX_ATTEMPTS:5}
    base-backoff: ${PIXFLOW_RECONCILIATION_BASE_BACKOFF:2s}
    max-backoff: ${PIXFLOW_RECONCILIATION_MAX_BACKOFF:5m}
    jitter: ${PIXFLOW_RECONCILIATION_JITTER:500ms}
    result-topic: ${PIXFLOW_RECONCILIATION_RESULT_TOPIC:payment.result.v1}

management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${PIXFLOW_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        pixflow.reconciliation.duration: true
        pixflow.payment.resolution: true
      percentiles:
        pixflow.reconciliation.duration: 0.5,0.95,0.99
        pixflow.payment.resolution: 0.5,0.95,0.99
logging:
  structured:
    format.console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${PIXFLOW_ENVIRONMENT:local}
      rename:
        "[@timestamp]": timestamp
