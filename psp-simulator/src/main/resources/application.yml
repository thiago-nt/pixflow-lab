server:
  address: ${PIXFLOW_PSP_BIND:0.0.0.0}
  port: ${PIXFLOW_PSP_PORT:8080}
spring:
  application.name: psp-simulator
  datasource:
    url: ${PIXFLOW_DB_URL:jdbc:postgresql://127.0.0.1:55432/pixflow}
    username: ${PIXFLOW_DB_USER:pixflow_app}
    password: ${PIXFLOW_DB_PASSWORD:pixflow_lab_dev_only}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${PIXFLOW_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
logging:
  structured:
    format.console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${PIXFLOW_ENVIRONMENT:local}
      rename:
        "[@timestamp]": timestamp
