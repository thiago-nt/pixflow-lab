global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 2s
  timeout client 15s
  timeout server 15s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s

frontend payment_api
  bind :8080
  default_backend payment_api_nodes

backend payment_api_nodes
  balance roundrobin
  option httpchk GET /actuator/health/readiness
  http-check expect status 200
  server-template api 3 payment-api:8080 check resolvers docker init-addr libc,none
