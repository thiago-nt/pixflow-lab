<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixFlow Live</title><link rel="stylesheet" href="/lab/app.css"></head>
<body><main><header><div><h1>PixFlow Live</h1><p>Dados sintéticos persistidos no PostgreSQL</p></div><span id="updated">Aguardando</span></header>
<section class="flow"><b>Cliente</b><b>Payment API</b><b>PostgreSQL</b><b>Outbox gravada</b><b>Kafka<br>Relay ativo</b><b>Worker<br>Ativo</b><b>PSP<br>Simulador</b><span>Reconciliação<br>NÃO IMPLEMENTADO</span></section>
<section class="grid"><form id="create"><h2>Criar pagamento sintético</h2><label>Conta<input id="account" value="test-account-1" required></label><label>Valor<input id="amount" value="123.45" type="number" step="0.01" required></label><label>Referência<input id="reference" value="demo-001" required></label><label>Resultado PSP no simulador<select id="scenario"><option>APPROVED</option><option>REJECTED</option><option>TIMEOUT</option></select></label><label>Idempotency-Key<input id="key" required></label><div><button>Criar/Reenviar</button><button type="button" id="newKey">Nova chave</button></div></form><article><h2>Resultado</h2><pre id="result">Aguardando operação.</pre></article></section>
<section><div class="toolbar"><h2>Pagamentos persistidos</h2><button id="refresh">Atualizar</button><button id="pause">Pausar</button></div><div id="cards" class="cards"></div></section><dialog id="detail"><button onclick="this.parentElement.close()">Fechar</button><pre id="detailText"></pre></dialog></main><script src="/lab/app.js"></script></body></html>
