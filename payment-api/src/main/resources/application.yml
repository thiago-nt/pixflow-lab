server:
  address: ${PIXFLOW_API_BIND:127.0.0.1}
  port: ${PIXFLOW_API_PORT:8080}
spring:
  application.name: payment-api
  datasource:
    url: ${PIXFLOW_DB_URL:jdbc:postgresql://127.0.0.1:55432/pixflow}
    username: ${PIXFLOW_DB_USER:pixflow_app}
    password: ${PIXFLOW_DB_PASSWORD:pixflow_lab_dev_only}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jackson:
    default-property-inclusion: non_null
  flyway.enabled: false
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${PIXFLOW_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        pixflow.payment.resolution: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        pixflow.payment.resolution: 0.5,0.95,0.99
logging:
  structured:
    format.console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${PIXFLOW_ENVIRONMENT:local}
      rename:
        "[@timestamp]": timestamp
